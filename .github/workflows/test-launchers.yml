name: Test CLI Launchers on all the platforms
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Deploy and Test on Linux x64 architecture
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[skip ci]') ) || (github.event_name == 'workflow_dispatch' && github.repository == 'scala/scala3' )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729   # v1.5.8
    - name: Build and test launcher command
      run: ./project/scripts/native-integration/bashTests
      env:
        LAUNCHER_EXPECTED_PROJECT: "dist-linux-x86_64"

  linux-aarch64:
    name: Deploy and Test on Linux ARM64 architecture
    runs-on: ubuntu-24.04-arm
    if: (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[skip ci]') ) || (github.event_name == 'workflow_dispatch' && github.repository == 'scala/scala3' )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729   # v1.5.8
    - name: Build and test launcher command
      run: ./project/scripts/native-integration/bashTests
      env:
        LAUNCHER_EXPECTED_PROJECT: "dist-linux-aarch64"

