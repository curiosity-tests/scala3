###################################################################################################
###                                  OFFICIAL RELEASE WORKFLOW                                  ###
### HOW TO USE:                                                                                 ###
###   - THIS WORKFLOW WILL NEED TO BE TRIGGERED MANUALLY                                        ###
###                                                                                             ###
### NOTE:                                                                                       ###
###   - THIS WORKFLOW SHOULD ONLY BE RUN ON STABLE RELEASES                                     ###
###   - IT ASSUMES THAT THE PRE-RELEASE WORKFLOW WAS PREVIOUSLY EXECUTED                        ###
###                                                                                             ###
###################################################################################################

name: Official release of Scala
run-name: Official release of Scala ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to officially release'
        required: true
        type: string

# Publishing uses credentials from secrets for each repository (SDKMAN,
# Chocolatey, etc), the GITHUB_TOKEN is only needed by the jobs that declare
# their own permissions.
permissions: {}

jobs:
  # TODO: ADD JOB TO SWITCH THE GITHUB RELEASE FROM DRAFT TO LATEST
  # The publish-* jobs push to external package managers and channels so we only
  # run then on scala/scala3. Forks running this workflow still build and test
  # the packages.
  publish-sdkman:
    uses: ./.github/workflows/publish-sdkman.yml
    if: github.repository == 'scala/scala3'
    with:
      version: ${{ inputs.version }}
    secrets:
      CONSUMER-KEY: ${{ secrets.SDKMAN_KEY }}
      CONSUMER-TOKEN: ${{ secrets.SDKMAN_TOKEN }}

  compute-digest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
    - name: Compute the SHA256 of scala3-${{ inputs.version }}-x86_64-pc-win32.zip in GitHub Release
      id: digest
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # TODO(puerco): Verify provenance of this artifact
        curl -o artifact.zip -L "https://github.com/${{ github.repository }}/releases/download/$VERSION/scala3-$VERSION-x86_64-pc-win32.zip"
        echo "digest=$(sha256sum artifact.zip | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"

